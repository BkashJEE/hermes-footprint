<!doctype html><html><head><meta charset="utf-8"><title>hermes-footprint harness</title>
<script type="importmap">{"imports":{"react":"https://esm.sh/react@19.1.0","react/jsx-runtime":"https://esm.sh/react@19.1.0/jsx-runtime","react-dom/client":"https://esm.sh/react-dom@19.1.0/client?deps=react@19.1.0","@hermes/plugin-sdk":"./mock-sdk.js"}}</script>
<style>
/* Nous dark values (apps/shared/src/theme-presets.ts darkColors + darkTerminal) */
:root{--ui-accent:#4a84fe;--ui-red:#ff7b72;--ui-yellow:#d29922;--ui-green:#3fb950;--ui-cyan:#39c5cf;--ui-purple:#bc8cff;--ui-orange:#ffa657;
--ui-text-primary:#e6edf3;--ui-text-secondary:#b1bac4;--ui-text-tertiary:#7d8590;--ui-text-quaternary:#6e7681;--ui-stroke-tertiary:#21262d;--ui-bg-elevated:#010409}
body{margin:0;background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif}
.app{display:flex;height:calc(100vh - 24px)}.side{width:200px;background:#010409;border-right:1px solid #21262d;padding:14px 10px;font-size:13px;color:#b1bac4}
.side div{padding:6px 10px;border-radius:6px}.side .on{background:#161b22;color:#fff}#root{flex:1;min-width:0}
.bar{position:fixed;bottom:0;left:0;right:0;height:24px;background:#010409;border-top:1px solid #21262d;display:flex;justify-content:flex-end;align-items:center;padding-right:10px}
</style></head><body>
<div class="app"><div class="side"><div>Sessions</div><div>Skills</div><div>Activity</div><div class="on">▦ Footprint</div><div>Settings</div></div><div id="root"></div></div>
<div class="bar" id="chip"></div>
<script type="module">
import { createRoot } from 'react-dom/client'
import { jsx } from 'react/jsx-runtime'
import plugin from '../desktop/plugin.js'
import { payload, trashResult, progressObj } from './mock-sdk.js'
const reg = []
const q = new URLSearchParams(location.search)
const wait = (ms) => new Promise((r) => setTimeout(r, ms))
// ctx.rest mirrors dashboard/plugin_api.py. ?via=cli makes it fail like a profile without the plugin,
// so the page's CLI fallback (host.requestProfile) is exercised instead.
const ctx = { register: (c) => { reg.push(c); return () => {} }, setInterval: (f, ms) => { const t = setInterval(f, ms); return () => clearInterval(t) },
  addEventListener: (t, e, f) => { t.addEventListener(e, f); return () => t.removeEventListener(e, f) },
  rest: async (path, opts = {}) => {
    window.__rest = (window.__rest || []).concat([path])
    if (q.get('via') === 'cli') throw new Error('404: {"detail":"plugin \'hermes-footprint\' is not enabled in this profile"}')
    if (path === '/scan') { if (q.get('slow')) { window.__scanStart = Date.now(); await wait(6000) } return payload }
    if (path === '/progress') return progressObj()
    if (path === '/stop') return { ok: true }
    if (path === '/trash') return trashResult(opts.body.paths)
    if (path === '/open') return { ok: true, path: opts.body.path }
    throw new Error('404: no route ' + path)
  } }
plugin.register(ctx)
window.__registered = reg.map((c) => ({ id: c.id, area: c.area, data: c.data && { path: c.data.path, label: c.data.label } }))
createRoot(document.getElementById('root')).render(reg.find((c) => c.area === 'routes').render())
createRoot(document.getElementById('chip')).render(reg.find((c) => c.area === 'statusBar.right').render())
// ?view=bots | deck | deck-end | confirm : clicks through the real page for README screenshots.
const view = new URLSearchParams(location.search).get('view')
const click = (re) => [...document.querySelectorAll('button')].find((b) => re.test(b.textContent))?.click()
const key = (k) => window.dispatchEvent(new KeyboardEvent('keydown', { key: k }))
const steps = { cards: [() => click(/^Can go/)], marked: [() => click(/^Can go/), () => [...document.querySelectorAll('button')].filter((b) => b.textContent === 'Trash')[1]?.click()], bots: [() => click(/^Made by your Bots/)], deck: [() => click(/^Review one by one/)],
  'deck-end': [() => click(/^Review one by one/), () => key('k'), () => key('t'), () => key('t'), () => key('t'), () => key('t'), () => key('t')],
  confirm: [() => click(/^Review one by one/), () => key('k'), () => key('t'), () => key('t'), () => key('t'), () => key('t'), () => key('t'), () => click(/^Next: confirm/)] }
// Wait until the page has its data (the tabs exist), then click through.
const ready = () => new Promise((res) => { const t = setInterval(() => { if ([...document.querySelectorAll('button')].some((b) => /^Hermes itself/.test(b.textContent))) { clearInterval(t); res() } }, 100) })
if (view && steps[view]) { try { localStorage.clear() } catch {}; ready().then(() => steps[view].forEach((f, i) => setTimeout(f, 200 + i * 120))) }
</script></body></html>
